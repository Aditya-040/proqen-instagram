name: Post to Instagram

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC = 7:30 PM IST, daily (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if something was already posted today"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (show what would be posted, don't post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish next post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/post.mjs
      - name: Save posting state
        if: always()
        run: |
          git config user.name "proqen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%F)" && git push)
