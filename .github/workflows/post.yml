name: Post to Instagram + X

on:
  # Main trigger: a daily Claude scheduled task (7:15 PM IST) pushes trigger/request.txt.
  push:
    branches: [main]
    paths: ["trigger/**"]
  schedule:
    # Backup only: GitHub's free scheduler has been running ~3-5 hours late.
    # The script posts at most once per posting day, so backups never double-post.
    - cron: "47 13 * * *" # 7:17 PM IST (main)
    - cron: "33 14 * * *" # 8:03 PM IST (backup)
    - cron: "19 15 * * *" # 8:49 PM IST (backup)
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if something was already posted today"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (show what would be posted, don't post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish next post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/post.mjs
      - name: Mirror the post to X
        # Runs even if Instagram failed (it mirrors whatever Instagram posted last, at most once),
        # and an X problem never fails the Instagram run.
        if: always()
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_INCLUDE_LINK: ${{ vars.X_INCLUDE_LINK }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/post-x.mjs
      - name: Save posting state
        if: always()
        run: |
          git config user.name "proqen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json state/x-posted.json 2>/dev/null || git add state/posted.json
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%F)" && git push)
